<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>T-CITY</title>
<style>
*{box-sizing:border-box}
:root{font-family:Arial,Helvetica,sans-serif;background:#000;color:#f3f3f3}
html,body{margin:0;width:100%;height:100%;background:#000}
body{overflow:hidden}
button{font:inherit}
.screen{
  position:fixed; inset:0;
  background:#000; color:#f2f2f2;
  padding:max(22px,env(safe-area-inset-top)) 22px max(24px,env(safe-area-inset-bottom));
  overflow:hidden;
}
.hidden{display:none!important}

/* launch */
#launch{display:flex;align-items:center;justify-content:center;user-select:none;touch-action:none;cursor:ns-resize}
.launch-title{font-size:clamp(36px,9.5vw,54px);font-weight:400;letter-spacing:-.025em}
.swipe{
  position:absolute;left:50%;bottom:max(28px,env(safe-area-inset-bottom));
  transform:translateX(-50%);
  border-bottom:1px solid #737373;color:#d7d7d7;
  padding:10px 2px 5px;font-size:11px;letter-spacing:.09em;
  pointer-events:none;
  animation:swipeHint 1.75s cubic-bezier(.2,.72,.2,1) infinite;
  will-change:transform
}
.swipe span{margin-right:7px}
@keyframes swipeHint{
  0%,68%,100%{transform:translate(-50%,0)}
  79%{transform:translate(-50%,-7px)}
  90%{transform:translate(-50%,0)}
}
.fade-out{animation:fadeOut .24s ease forwards;pointer-events:none}
@keyframes fadeOut{to{opacity:0}}

/* intro */
#launch{z-index:3}
#intro{padding:0;z-index:2;opacity:0;pointer-events:none;transition:opacity .24s ease}
#intro.active{opacity:1;pointer-events:auto}
#intro.fade-final{opacity:0;pointer-events:none;transition:opacity .42s ease}
#intro video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;transform:scale(1);transform-origin:50% 50%;will-change:transform}
.skip{position:absolute;right:16px;top:max(16px,env(safe-area-inset-top));border:0;background:rgba(0,0,0,.2);color:#666;padding:8px;font-size:9px;letter-spacing:.13em}

/* home */
#home{display:flex;flex-direction:column;opacity:1;background:#000;z-index:4;pointer-events:none}
#home.ready{pointer-events:auto}
.topbar{
  flex:0 0 clamp(220px,31dvh,250px);
  position:relative;
}

/* The logo keeps the approved first-wave size.
   Only the surrounding composition is given more breathing room on phones. */
.brand-logo{
  position:absolute;
  left:50%;
  top:clamp(62px,8.5dvh,76px);
  width:145px;
  height:145px;
  transform:translateX(-50%);
  opacity:1;
  pointer-events:none;
}
.brand-logo img{
  width:100%;height:100%;object-fit:contain;display:block;
}

/* Controls sit close to the safe-area corners instead of clustering around the logo. */
.icon{
  position:absolute;
  top:0;
  width:44px;height:44px;
  border:0;background:transparent;color:#aaa;
  display:grid;place-items:center;
  opacity:0;
  transition:transform .16s ease,color .16s ease;
}
.icon:first-child{left:-7px}
.icon:last-child{right:-7px}
.icon.show{animation:appear .34s ease .12s forwards}
.icon:active{transform:scale(.92)}
.icon svg{width:24px;height:24px;display:block}
@keyframes appear{to{opacity:1}}

/* New/unread notification marker. It disappears after the notification panel is opened. */
.notify-dot{
  position:absolute;
  width:6px;height:6px;border-radius:50%;
  background:#ff2d2d;
  top:8px;right:7px;
  opacity:0;transform:scale(.5);
  transition:opacity .2s ease,transform .2s ease;
}
.icon.unread .notify-dot{opacity:1;transform:scale(1)}

/* Flow layout prevents the car from ever sitting on top of the first menu row. */
.car-stage{
  position:relative;
  z-index:0;
  flex:0 0 auto;
  width:min(calc(100% - 18px),356px);
  aspect-ratio:664/121;
  margin:clamp(7px,1.4dvh,13px) auto clamp(24px,3.6dvh,34px);
  pointer-events:none;
}
.car-stage img{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:contain;display:block;
}
.car-body{
  opacity:0;
  filter:brightness(.34) contrast(1.08);
}
.car-lights{
  opacity:0;
  filter:brightness(.7) drop-shadow(0 0 0 rgba(255,255,255,0));
}
.car-stage.show .car-lights{
  animation:headlightsWake 1.75s cubic-bezier(.18,.72,.2,1) .06s forwards;
}
.car-stage.show .car-body{
  animation:bodyFromDark 1.55s cubic-bezier(.2,.72,.18,1) .28s forwards;
}
@keyframes headlightsWake{
  0%{opacity:0;filter:brightness(.45) drop-shadow(0 0 0 rgba(255,255,255,0))}
  18%{opacity:.16;filter:brightness(.68) drop-shadow(0 0 1px rgba(210,225,255,.08))}
  48%{opacity:.56;filter:brightness(1.05) drop-shadow(0 0 3px rgba(210,225,255,.17))}
  76%{opacity:.88;filter:brightness(1.22) drop-shadow(0 0 5px rgba(210,225,255,.23))}
  100%{opacity:1;filter:brightness(1.30) drop-shadow(0 0 6px rgba(210,225,255,.26))}
}
@keyframes bodyFromDark{
  0%{opacity:0;filter:brightness(.15) contrast(1.08)}
  35%{opacity:.13;filter:brightness(.24) contrast(1.08)}
  72%{opacity:.42;filter:brightness(.42) contrast(1.08)}
  100%{opacity:.66;filter:brightness(.56) contrast(1.08)}
}
.menu{
  flex:0 0 auto;
  width:min(calc(100% - 16px),520px);
  margin:0 auto;
  display:flex;flex-direction:column;
}
.menu button{
  display:grid;grid-template-columns:36px 1fr;gap:9px;align-items:center;
  width:100%;padding:12px 0 11px;border:0;border-bottom:1px solid #252525;
  background:transparent;color:#e8e8e8;text-align:left;opacity:0;transform:translateY(8px)
}
.menu button.show{animation:itemIn .46s cubic-bezier(.2,.72,.2,1) var(--d) forwards}
@keyframes itemIn{
  0%{opacity:0;transform:translateY(8px)}
  100%{opacity:1;transform:translateY(0)}
}
.menu button{transition:transform .15s ease,color .15s ease}
.menu button:active{transform:translateX(4px)}
.num{color:#5c5c5c;font-size:9px;letter-spacing:.1em}
.label{font-size:clamp(18px,4.55vw,23px);letter-spacing:-.025em}
.motto{
  margin-top:auto;
  padding-top:clamp(20px,3dvh,30px);
  text-align:center;color:#606060;font-size:10.2px;letter-spacing:.16em;opacity:0
}
.motto.show{animation:appear .42s ease 1.20s forwards}

/* Extra protection for shorter mobile browser viewports. */
@media(max-height:720px){
  .topbar{flex-basis:205px}
  .brand-logo{top:55px;width:138px;height:138px}
  .car-stage{margin-top:4px;margin-bottom:18px;width:min(calc(100% - 28px),338px)}
  .menu button{padding:10px 0 9px}
  .label{font-size:17.5px}
  .motto{padding-top:16px;font-size:9.6px}
}


/* WAVE 02 — HISTORY / ABOUT */
#history{
  z-index:7;
  padding:max(18px,env(safe-area-inset-top)) 22px max(22px,env(safe-area-inset-bottom));
  touch-action:none;
  user-select:none;
}
.history-top{
  position:relative;
  height:58px;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:5;
}
.history-menu{
  position:absolute;
  left:-6px;top:2px;
  width:44px;height:44px;
  border:0;background:transparent;color:#9f9f9f;
  display:grid;place-items:center;
}
.history-menu:active{transform:scale(.93)}
.history-menu svg{width:22px;height:22px}
.history-dots{
  display:flex;align-items:center;justify-content:center;gap:8px;
  height:20px;
}
.history-dot{
  width:4px;height:4px;border-radius:50%;
  background:#3c3c3c;
  transition:width .24s ease,height .24s ease,background .24s ease,box-shadow .24s ease,transform .24s ease;
}
.history-dot.active{
  width:6px;height:6px;
  background:#cfcfcf;
  box-shadow:0 0 7px rgba(255,255,255,.15);
}
.history-viewport{
  position:absolute;
  left:22px;right:22px;
  top:78px;
  bottom:max(25px,env(safe-area-inset-bottom));
  overflow:hidden;
}
.history-card{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  justify-content:center;
  max-width:520px;
  margin:0 auto;
  padding:12px 2px 24px;
}
.history-kicker{
  color:#5f5f5f;
  font-size:9px;
  letter-spacing:.16em;
  margin-bottom:16px;
}
.history-title{
  margin:0 0 24px;
  font-size:clamp(25px,7.1vw,38px);
  line-height:1.04;
  font-weight:400;
  letter-spacing:-.035em;
  max-width:11ch;
}
.history-title.wide{max-width:17ch}
.history-copy{
  color:#aaa;
  font-size:clamp(14.5px,3.85vw,17.5px);
  line-height:1.55;
  letter-spacing:-.012em;
  max-width:35ch;
}
.history-copy p{margin:0 0 13px}
.history-copy p:last-child{margin-bottom:0}
.history-em{
  color:#ededed;
  font-size:clamp(18px,4.8vw,23px);
  line-height:1.28;
  letter-spacing:-.022em;
}
.history-rule{
  width:38px;height:1px;background:#3b3b3b;margin:23px 0;
}
.history-list{
  display:grid;gap:8px;
  margin-top:8px;
  color:#b7b7b7;
  font-size:clamp(14px,3.8vw,17px);
}
.history-list span{
  opacity:0;transform:translateY(5px);
}
.history-card.page-3 .history-list span{
  animation:historyLine .42s ease forwards;
}
.history-card.page-3 .history-list span:nth-child(1){animation-delay:.12s}
.history-card.page-3 .history-list span:nth-child(2){animation-delay:.21s}
.history-card.page-3 .history-list span:nth-child(3){animation-delay:.30s}
.history-card.page-3 .history-list span:nth-child(4){animation-delay:.39s}
.history-card.page-3 .history-list span:nth-child(5){animation-delay:.48s}
@keyframes historyLine{to{opacity:1;transform:translateY(0)}}

.history-city-lines{
  position:absolute;inset:13% -8% 8%;
  pointer-events:none;
  opacity:.23;
}
.history-city-lines:before,
.history-city-lines:after{
  content:"";position:absolute;inset:0;
  background:
    linear-gradient(90deg,transparent 8%,#202020 8.2%,transparent 8.4%),
    linear-gradient(90deg,transparent 42%,#181818 42.15%,transparent 42.3%),
    linear-gradient(90deg,transparent 76%,#202020 76.15%,transparent 76.3%),
    linear-gradient(0deg,transparent 22%,#1c1c1c 22.15%,transparent 22.3%),
    linear-gradient(0deg,transparent 61%,#191919 61.15%,transparent 61.3%);
}
.history-city-lines:after{transform:rotate(-11deg) scale(1.08);opacity:.6}

.history-quote{
  margin-top:22px;
  padding-top:18px;
  border-top:1px solid #242424;
  color:#e4e4e4;
  font-size:clamp(17px,4.6vw,22px);
  line-height:1.38;
  letter-spacing:-.02em;
  max-width:30ch;
}
.history-honesty{
  margin-top:23px;
}
.history-honesty h3{
  margin:0 0 12px;
  color:#ededed;
  font-size:12px;font-weight:400;letter-spacing:.16em;
}
.history-trust{
  margin-top:17px;
  color:#ededed;
  opacity:0;
  animation:trustIn .55s ease .48s forwards;
}
@keyframes trustIn{to{opacity:1}}

.history-final{
  text-align:left;
}
.history-final .history-title{
  max-width:none;
  margin-bottom:34px;
}
.history-three{
  display:grid;gap:5px;
  margin-bottom:28px;
  font-size:clamp(27px,7.7vw,41px);
  line-height:1.05;
  letter-spacing:-.04em;
}
.history-final-note{
  color:#8f8f8f;
  font-size:clamp(13.5px,3.6vw,16px);
  line-height:1.55;
  max-width:34ch;
}
.history-continues{
  margin-top:auto;
  padding-top:28px;
  color:#5e5e5e;
  font-size:11px;
  letter-spacing:.08em;
  font-style:italic;
}

/* Directional page motion — restrained, no flashy carousel effect. */
.history-card.enter-next{animation:historyEnterNext .34s cubic-bezier(.2,.72,.2,1)}
.history-card.enter-prev{animation:historyEnterPrev .34s cubic-bezier(.2,.72,.2,1)}
@keyframes historyEnterNext{
  from{opacity:0;transform:translateX(22px)}
  to{opacity:1;transform:translateX(0)}
}
@keyframes historyEnterPrev{
  from{opacity:0;transform:translateX(-22px)}
  to{opacity:1;transform:translateX(0)}
}

@media(max-height:720px){
  .history-viewport{top:70px}
  .history-card{justify-content:flex-start;padding-top:34px}
  .history-title{font-size:25px;margin-bottom:18px}
  .history-copy{font-size:14px;line-height:1.48}
  .history-copy p{margin-bottom:9px}
  .history-rule{margin:17px 0}
  .history-quote{margin-top:16px;padding-top:14px;font-size:17px}
  .history-honesty{margin-top:16px}
  .history-three{font-size:27px;margin-bottom:20px}
}

/* placeholders */
#page{display:flex;flex-direction:column}
#page:not(.hidden){animation:pageIn .22s ease}
@keyframes pageIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.page-head{height:58px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;border-bottom:1px solid #1d1d1d;color:#737373;font-size:10px;letter-spacing:.14em;text-align:center}
.back{border:0;background:transparent;color:#aaa;font-size:24px;width:44px;height:44px}
.page-body{flex:1;display:grid;place-items:center;text-align:center}
.page-body p{color:#777;font-size:16px;margin:0}

/* sheet */
#shade{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(5px);z-index:10;display:flex;align-items:flex-end}
.sheet{width:100%;min-height:34vh;background:#080808;border-top:1px solid #242424;padding:24px 22px max(32px,env(safe-area-inset-bottom));animation:sheet .35s ease}
@keyframes sheet{from{transform:translateY(30px);opacity:0}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;font-size:22px;margin-bottom:26px}
.close{border:0;background:transparent;color:#aaa;font-size:24px}
.sheet p{color:#777;line-height:1.65;max-width:38ch;margin:0}

/* desktop phone-like preview */
@media(min-width:720px){
  body{background:#101010;display:grid;place-items:center}
  .screen{left:50%;right:auto;top:50%;bottom:auto;width:390px;height:844px;transform:translate(-50%,-50%);border:1px solid #202020}
  #shade{left:50%;right:auto;top:50%;bottom:auto;width:390px;height:844px;transform:translate(-50%,-50%)}
}

/* =========================================================
   WAVE 03 — SERVICES + CALCULATOR + BOOKING
   ========================================================= */
#flow{
  z-index:8;
  padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
}
.flow-head{
  flex:0 0 58px;
  display:grid;
  grid-template-columns:44px 1fr 44px;
  align-items:center;
  border-bottom:1px solid #1d1d1d;
  position:relative;
  z-index:5;
}
.flow-menu{
  width:44px;height:44px;border:0;background:transparent;color:#9c9c9c;
  display:grid;place-items:center;padding:0;
}
.flow-menu:active{transform:scale(.93)}
.flow-menu svg{width:22px;height:22px}
.flow-brand{
  text-align:center;
  color:#6c6c6c;
  font-size:9px;
  letter-spacing:.17em;
}
.flow-step{
  text-align:right;
  color:#4e4e4e;
  font-size:8px;
  letter-spacing:.1em;
}
.flow-body{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  padding:24px 2px 150px;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.flow-body::-webkit-scrollbar{display:none}
.flow-enter{animation:flowEnter .25s cubic-bezier(.2,.72,.2,1)}
@keyframes flowEnter{
  from{opacity:0;transform:translateY(7px)}
  to{opacity:1;transform:translateY(0)}
}
.eyebrow{
  color:#555;
  font-size:9px;
  letter-spacing:.16em;
  margin-bottom:12px;
}
.flow-title{
  margin:0;
  font-size:clamp(27px,7.1vw,38px);
  line-height:1.02;
  font-weight:400;
  letter-spacing:-.04em;
}
.flow-lead{
  margin:14px 0 0;
  color:#8a8a8a;
  font-size:14px;
  line-height:1.5;
  max-width:34ch;
}
.flow-section{
  margin-top:30px;
}
.flow-section-title{
  color:#686868;
  font-size:9px;
  letter-spacing:.14em;
  margin-bottom:12px;
}
.vehicle-grid{
  display:grid;
  gap:10px;
  margin-top:26px;
}
.vehicle-card{
  width:100%;
  min-height:76px;
  border:1px solid #242424;
  background:#050505;
  color:#d8d8d8;
  padding:16px 17px;
  text-align:left;
  display:grid;
  grid-template-columns:1fr auto;
  align-items:center;
  transition:border-color .18s ease,background .18s ease,transform .16s ease;
}
.vehicle-card:active{transform:scale(.99)}
.vehicle-card.selected{
  border-color:#7a7a7a;
  background:#0a0a0a;
}
.vehicle-name{
  font-size:18px;
  letter-spacing:-.02em;
}
.vehicle-note{
  margin-top:5px;
  color:#5d5d5d;
  font-size:10px;
}
.vehicle-arrow{color:#555;font-size:16px}

.package-list{
  display:grid;
  gap:12px;
  margin-top:22px;
}
.package-card{
  border:1px solid #242424;
  background:#050505;
  padding:18px 17px 17px;
  transition:border-color .18s ease,background .18s ease;
}
.package-card.selected{
  border-color:#8d8d8d;
  background:#0a0a0a;
}
.package-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
}
.package-name{
  font-size:23px;
  letter-spacing:-.035em;
}
.package-price{
  text-align:right;
  font-size:18px;
  white-space:nowrap;
}
.package-time{
  margin-top:5px;
  color:#5d5d5d;
  font-size:9px;
  letter-spacing:.08em;
}
.package-desc{
  margin:13px 0 0;
  color:#8d8d8d;
  font-size:13px;
  line-height:1.48;
}
.package-includes{
  margin:15px 0 0;
  padding-top:14px;
  border-top:1px solid #1c1c1c;
  color:#656565;
  font-size:11px;
  line-height:1.55;
}
.package-pick{
  margin-top:15px;
  border:0;
  border-bottom:1px solid #6d6d6d;
  background:transparent;
  color:#d9d9d9;
  padding:4px 0 5px;
  font-size:10px;
  letter-spacing:.08em;
}
.custom-entry{
  width:100%;
  margin-top:12px;
  padding:17px;
  border:1px solid #303030;
  background:transparent;
  color:#dcdcdc;
  text-align:left;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.custom-entry strong{
  font-size:14px;
  font-weight:400;
  letter-spacing:.04em;
}
.custom-entry span{color:#5e5e5e}

.service-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:20px;
}
.service-card{
  min-height:112px;
  border:1px solid #242424;
  background:#050505;
  color:#d6d6d6;
  padding:14px 13px 12px;
  text-align:left;
  position:relative;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  transition:border-color .17s ease,background .17s ease,transform .15s ease;
}
.service-card:active{transform:scale(.985)}
.service-card.selected{
  border-color:#8d8d8d;
  background:#0b0b0b;
}
.service-card.included{
  opacity:.4;
  border-style:dashed;
}
.service-name{
  font-size:13px;
  line-height:1.24;
}
.service-price{
  margin-top:12px;
  color:#ababab;
  font-size:12px;
}
.service-duration{
  color:#555;
  font-size:9px;
  margin-top:4px;
}
.service-check{
  position:absolute;
  top:9px;right:10px;
  color:#a8a8a8;
  font-size:12px;
  opacity:0;
}
.service-card.selected .service-check{opacity:1}
.service-card.included .service-check{opacity:1;color:#666}
.service-card.included .service-check::after{content:"В ПАКЕТЕ";font-size:7px;letter-spacing:.08em}

.flow-note{
  margin-top:22px;
  padding-top:17px;
  border-top:1px solid #202020;
  color:#555;
  font-size:10px;
  line-height:1.5;
}
.flow-summary{
  position:absolute;
  left:18px;right:18px;
  bottom:max(18px,env(safe-area-inset-bottom));
  z-index:6;
  background:rgba(5,5,5,.94);
  backdrop-filter:blur(12px);
  border:1px solid #292929;
  padding:13px;
  box-shadow:0 -12px 36px rgba(0,0,0,.62);
}
.summary-line{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:12px;
}
.summary-meta{
  color:#686868;
  font-size:9px;

/* Detailing bay scene: intentionally built in CSS so black cars remain visible. */
.garage-hero{
  position:relative;margin-top:17px;height:285px;border:1px solid #252525;overflow:hidden;
  background:
    linear-gradient(90deg,transparent 0 9%,rgba(255,255,255,.035) 9.2% 9.6%,transparent 9.8% 90%,rgba(255,255,255,.035) 90.2% 90.6%,transparent 90.8%),
    linear-gradient(180deg,#111 0%,#090909 54%,#050505 55%,#0a0a0a 100%);
}
.garage-hero:before{
  content:'';position:absolute;left:50%;top:20px;width:78%;height:8px;transform:translateX(-50%);
  background:linear-gradient(90deg,transparent,#cfcfcf 18% 82%,transparent);opacity:.23;filter:blur(1px);
  box-shadow:0 0 24px rgba(255,255,255,.12),0 110px 70px rgba(255,255,255,.035);
}
.garage-hero:after{
  content:'';position:absolute;left:-15%;right:-15%;bottom:-35px;height:130px;
  background:repeating-linear-gradient(90deg,transparent 0 72px,rgba(255,255,255,.018) 73px 74px),linear-gradient(180deg,rgba(255,255,255,.025),transparent 55%);
  transform:perspective(220px) rotateX(60deg);transform-origin:bottom;
}
.garage-bay-lines{position:absolute;inset:0;pointer-events:none}
.garage-bay-lines i{position:absolute;top:28px;bottom:72px;width:2px;background:#d8d8d8;opacity:.12;box-shadow:0 0 12px rgba(255,255,255,.12)}

let introRetryTimer=0;
let introWatchTimer=0;

let introLastTime=0;
let introLastProgressAt=0;
let introReloaded=false;

try{
  introVideo.preload='auto';
  introVideo.load();
}catch(_){}

function animateVideoZoom(){
  if(!introStarted || homeStarted) return;
  const t=introVideo.currentTime;
  let scale=1;

  const smooth=k=>k*k*(3-2*k);

  if(t>=0.65 && t<2.05){
    const k=smooth(Math.min(1,(t-0.65)/(2.05-0.65)));
    scale=1+(0.20*k);
  }else if(t>=2.05 && t<2.55){
    const k=smooth(Math.min(1,(t-2.05)/(2.55-2.05)));
    scale=1.20+((1.82-1.20)*k);
  }else if(t>=2.55 && t<3.05){
    scale=1.82;
  }else if(t>=3.05 && t<3.52){
    // Approved zoom reset remains hidden inside the pure-black source frames.
    const k=smooth(Math.min(1,(t-3.05)/(3.52-3.05)));
    scale=1.82+((1-1.82)*k);
  }

  introVideo.style.transform=`scale(${scale})`;
  zoomRAF=requestAnimationFrame(animateVideoZoom);
}

function clearIntroRecovery(){
  clearTimeout(introRetryTimer);
  clearInterval(introWatchTimer);
}

function tryIntroPlay(){
  if(!introStarted || homeStarted) return;
  introAttempt+=1;
  introVideo.muted=true;
  introVideo.playsInline=true;
  introVideo.playbackRate=1.18;

  const p=introVideo.play();
  if(p && p.then){
    p.then(()=>{
      introLastProgressAt=performance.now();
    }).catch(()=>{
      scheduleIntroRetry();
    });
  }
}

function scheduleIntroRetry(){
  if(!introStarted || homeStarted) return;
  clearTimeout(introRetryTimer);
  introRetryTimer=setTimeout(()=>{
    if(!introStarted || homeStarted) return;

    // If Telegram/iOS never actually started frame progression,
    // reload the source once and immediately retry from the user's gesture flow.
    if(introVideo.currentTime<0.08 && introAttempt>=2 && !introReloaded){
      introReloaded=true;
      try{
        introVideo.pause();
        introVideo.load();
        introVideo.currentTime=0;
      }catch(_){}
    }
    tryIntroPlay();
  },320);
}

function startIntroWatch(){
  clearInterval(introWatchTimer);
  introLastTime=introVideo.currentTime||0;
  introLastProgressAt=performance.now();

  introWatchTimer=setInterval(()=>{
    if(!introStarted || homeStarted){
      clearIntroRecovery();
      return;
    }

    const now=performance.now();
    const t=introVideo.currentTime||0;

    if(t>introLastTime+0.015){
      introLastTime=t;
      introLastProgressAt=now;
    }else if(now-introLastProgressAt>1050){
      // A play() promise can resolve while the mobile WebView is still stalled.
      // Actively ask it to continue instead of leaving the user on a black screen.
      introLastProgressAt=now;
      scheduleIntroRetry();
    }

    // Last-resort protection: never leave the app permanently frozen.
    // SKIP still remains available, but after repeated failed starts we enter home ourselves.
    if(now-introStartAt>7000 && t<0.12){
      beginHomeBlend(true);
    }
  },260);
}

function startIntro(){
  if(introStarted) return;
  introStarted=true;
  introAttempt=0;
  introReloaded=false;
  introStartAt=performance.now();
  introLastProgressAt=introStartAt;

  try{
    introVideo.currentTime=0;
    introVideo.playbackRate=1.18;
  }catch(_){}

  intro.classList.add('active');
  launch.classList.add('fade-out');

  tryIntroPlay();
  startIntroWatch();
  zoomRAF=requestAnimationFrame(animateVideoZoom);
  setTimeout(()=>launch.classList.add('hidden'),260);
}

launch.addEventListener('pointerdown',e=>{
  if(introStarted) return;
  activePointer=e.pointerId;
  startY=e.clientY;
  try{launch.setPointerCapture(e.pointerId)}catch(_){}
});
launch.addEventListener('pointerup',e=>{
  if(activePointer!==e.pointerId) return;
  const dy=startY===null?0:startY-e.clientY;
  activePointer=null;
  startY=null;
  if(dy>48) startIntro();
});
launch.addEventListener('pointercancel',()=>{
  activePointer=null;
  startY=null;
});

function beginHomeBlend(immediate=false){
  if(homeStarted) return;
  homeStarted=true;
  clearIntroRecovery();
  cancelAnimationFrame(zoomRAF);
  introVideo.style.transform='scale(1)';
  home.classList.remove('hidden');
  requestAnimationFrame(()=>{
    supportBtn.classList.add('show');
    notifyBtn.classList.add('show');
    carStage.classList.add('show');
    document.querySelectorAll('.menu button').forEach(b=>b.classList.add('show'));
    document.querySelector('.motto').classList.add('show');
    if(immediate){
      intro.classList.remove('active');
      intro.classList.add('hidden');
      home.classList.add('ready');
      introVideo.pause();
    }else{
      intro.classList.add('fade-final');
      setTimeout(()=>{
        intro.classList.remove('active','fade-final');
        intro.classList.add('hidden');
        home.classList.add('ready');
        introVideo.pause();
      },430);
    }
  });
}

introVideo.addEventListener('timeupdate',()=>{
  if((introVideo.currentTime||0)>introLastTime+0.015){
    introLastTime=introVideo.currentTime;
    introLastProgressAt=performance.now();
  }
  // Approved first-wave transition point is unchanged.
  if(introVideo.currentTime>=11.55) beginHomeBlend(false);
});
introVideo.addEventListener('playing',()=>{
  introLastTime=introVideo.currentTime||0;
  introLastProgressAt=performance.now();
});
introVideo.addEventListener('waiting',scheduleIntroRetry);
introVideo.addEventListener('stalled',scheduleIntroRetry);
introVideo.addEventListener('suspend',()=>{
  if(introStarted && !homeStarted && introVideo.currentTime<0.1) scheduleIntroRetry();
});
introVideo.addEventListener('error',scheduleIntroRetry);
introVideo.addEventListener('ended',()=>beginHomeBlend(false));
document.querySelector('.skip').addEventListener('click',()=>beginHomeBlend(true));

let historyIndex=0;
let historyLocked=false;
let historyPointer=null;
let historyStartX=0;
let historyStartY=0;

function buildHistoryDots(){
  historyDots.innerHTML='';
  historyPages.forEach((_,i)=>{
    const dot=document.createElement('span');
    dot.className='history-dot'+(i===historyIndex?' active':'');
    historyDots.appendChild(dot);
  });
}

function renderHistory(direction='next',initial=false){
  const p=historyPages[historyIndex];
  historyCard.className='history-card '+p.cls;
  historyCard.innerHTML=p.html;
  buildHistoryDots();
  if(!initial){
    void historyCard.offsetWidth;
    historyCard.classList.add(direction==='prev'?'enter-prev':'enter-next');
  }
}

function storageGet(key){
  try{return localStorage.getItem(key)}catch(_){return null}
}
function storageSet(key,value){
  try{localStorage.setItem(key,value)}catch(_){}
}
function storageRemove(key){
  try{localStorage.removeItem(key)}catch(_){}
}

function openHistory(){
  home.classList.add('hidden');
  page.classList.add('hidden');
  flow.classList.add('hidden');
  historyIndex=0;
  renderHistory('next',true);
  history.classList.remove('hidden');

  if(!storageGet('tcity_history_tip_seen')){
    historyCoach.classList.remove('hidden');
  }
}

historyCoachOk.addEventListener('click',e=>{
  e.stopPropagation();
  storageSet('tcity_history_tip_seen','1');
  historyCoach.classList.add('hidden');
});

function closeHistory(){
  history.classList.add('hidden');
  home.classList.remove('hidden');
}

function moveHistory(delta){
  if(historyLocked) return;
  const next=historyIndex+delta;
  if(next<0 || next>=historyPages.length) return;
  historyLocked=true;
  historyIndex=next;
  renderHistory(delta<0?'prev':'next',false);
  setTimeout(()=>historyLocked=false,350);
}

historyMenuBtn.addEventListener('click',e=>{
  e.stopPropagation();
  closeHistory();
});

historyViewport.addEventListener('pointerdown',e=>{
  historyPointer=e.pointerId;
  historyStartX=e.clientX;
  historyStartY=e.clientY;
  try{historyViewport.setPointerCapture(e.pointerId)}catch(_){}
});

historyViewport.addEventListener('pointerup',e=>{
  if(historyPointer!==e.pointerId) return;
  const dx=e.clientX-historyStartX;
  const dy=e.clientY-historyStartY;
  historyPointer=null;

  if(Math.abs(dx)>48 && Math.abs(dx)>Math.abs(dy)){
    if(dx<0) moveHistory(1);
    else moveHistory(-1);
    return;
  }

  if(Math.abs(dx)<18 && Math.abs(dy)<18){
    const rect=historyViewport.getBoundingClientRect();
    const localX=e.clientX-rect.left;
    if(localX>rect.width/2) moveHistory(1);
    else moveHistory(-1);
  }
});

historyViewport.addEventListener('pointercancel',()=>{historyPointer=null});

function money(n){
  return new Intl.NumberFormat('ru-RU').format(n)+' ₽';
}
function hourText(n){
  const h=Math.max(1,Math.ceil(n));
  if(h===1) return '≈ 1 час';
  if(h>=2 && h<=4) return `≈ ${h} часа`;
  return `≈ ${h} часов`;
}
function selectedPackage(){
  return PACKAGES.find(p=>p.id===flowState.packageId)||null;
}
function includedSet(){
  const p=selectedPackage();
  return new Set(p?p.includedIds:[]);
}
function estimateWorkHours(pkg,extraIds){
  const ids=[...extraIds];
  const major4=ids.some(id=>id==='ceramic' || id==='dryclean');
  const major3=ids.some(id=>id==='expresspolish');

  // Time is an estimate of the whole job, NOT a sum of every small operation.
  // Standard combinations are intentionally capped at 4 hours in the prototype.
  if(pkg){
    let estimate=pkg.hours;
    if(major4) estimate=Math.max(estimate,4);
    else if(major3) estimate=Math.max(estimate,3);

    if(ids.length>=3 && ids.length<=5) estimate=Math.max(estimate,Math.min(4,pkg.hours+1));
    if(ids.length>=6) estimate=Math.max(estimate,Math.min(4,pkg.hours+2));
    return Math.min(4,Math.max(1,estimate));
  }

  if(ids.length===0) return 0;
  let estimate=1;
  if(ids.length>=3) estimate=2;
  if(ids.length>=6) estimate=3;
  if(ids.length>=10) estimate=4;
  if(major3) estimate=Math.max(estimate,3);
  if(major4) estimate=4;
  return Math.min(4,estimate);
}

function calcSelection(){
  const vehicle=flowState.vehicle;
  if(!vehicle) return {total:0,hours:0,count:0,rows:[]};

  let total=0;
  let rows=[];
  const p=selectedPackage();

  if(p){
    total+=p.prices[vehicle];
    rows.push({name:`${p.name} · ${p.tag}`,price:p.prices[vehicle]});
  }

  const included=includedSet();
  const actualExtras=new Set();
  SERVICES.forEach(s=>{
    if(flowState.extras.has(s.id) && !included.has(s.id)){
      total+=s.prices[vehicle];
      actualExtras.add(s.id);
      rows.push({name:s.name,price:s.prices[vehicle]});
    }
  });

  const hours=estimateWorkHours(p,actualExtras);
  return {total,hours,count:rows.length,rows};
}

}

  garage.classList.add('hidden');

}

}

const DOW=['ВС','ПН','ВТ','СР','ЧТ','ПТ','СБ'];
const MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

const BOOKINGS_KEY='tcity_bookings_v043';
const FEEDBACKS_KEY='tcity_booking_feedbacks_v043';
const BONUS_WALLET_KEY='tcity_tbonus_wallet_v043';
const T_CITY_TIMEZONE='Asia/Yekaterinburg';

const BOOKING_STATUS={
  waiting:{title:'ЖДЁМ ВАС',short:'Ждём вас'},
  work:{title:'АВТОМОБИЛЬ В РАБОТЕ',short:'Автомобиль в работе'},
  ready:{title:'ГОТОВ · МОЖНО ЗАБИРАТЬ',short:'Готов'},
  completed:{title:'ЗАВЕРШЕНО',short:'Завершено'}
};
const BOOKING_STATUS_ORDER=['waiting','work','ready','completed'];

function tCityDateParts(date=new Date()){
  const parts=new Intl.DateTimeFormat('en-CA',{
    timeZone:T_CITY_TIMEZONE,year:'numeric',month:'2-digit',day:'2-digit'
  }).formatToParts(date).reduce((a,x)=>{a[x.type]=x.value;return a},{});
  return {year:Number(parts.year),month:Number(parts.month),day:Number(parts.day)};
}
function tCityTodayDate(){
  const p=tCityDateParts();
  return new Date(p.year,p.month-1,p.day,12,0,0,0);
}
function tCityDateKey(date=new Date()){
  const p=tCityDateParts(date);
  return `${p.year}-${String(p.month).padStart(2,'0')}-${String(p.day).padStart(2,'0')}`;
}

function getBonusWallet(){
  const raw=storageGet(BONUS_WALLET_KEY);
  if(raw){
    try{
      const w=JSON.parse(raw);
      if(w && typeof w==='object' && Array.isArray(w.transactions)) return w;
    }catch(_){}
  }
  const demo={
    balance:2400,
    earnedTotal:2400,
    spentTotal:0,
    transactions:[
      {id:'tb-demo-1',type:'credit',amount:1500,title:'5% за завершённый визит',date:'14 августа 2026'},
      {id:'tb-demo-2',type:'credit',amount:900,title:'Подарок T-CITY',date:'2 июля 2026'}
    ]
  };
  storageSet(BONUS_WALLET_KEY,JSON.stringify(demo));
  return demo;
}
function saveBonusWallet(w){
  storageSet(BONUS_WALLET_KEY,JSON.stringify(w));
  updateBonusMenu();
}
function bonusBalance(){return Math.max(0,Number(getBonusWallet().balance)||0)}
function updateBonusMenu(){
  const el=document.getElementById('menuBonusBalance');
  if(el) el.textContent=`${new Intl.NumberFormat('ru-RU').format(bonusBalance())} T`;
}
function bonusTx(type,amount,title){
  amount=Math.max(0,Math.round(Number(amount)||0));
  if(!amount) return;
  const w=getBonusWallet();
  if(type==='credit'){
    w.balance=(Number(w.balance)||0)+amount;
    w.earnedTotal=(Number(w.earnedTotal)||0)+amount;
  }else{
    w.balance=Math.max(0,(Number(w.balance)||0)-amount);
    w.spentTotal=(Number(w.spentTotal)||0)+amount;
  }
  w.transactions.unshift({
    id:`tb-${Date.now()}-${Math.random().toString(16).slice(2)}`,
    type,amount,title,date:new Intl.DateTimeFormat('ru-RU',{timeZone:T_CITY_TIMEZONE,day:'numeric',month:'long',year:'numeric'}).format(new Date())
  });
  saveBonusWallet(w);
}
function settleBookingBonuses(b){
  if(b.bonusSettled) return b;
  const use=Math.min(Math.max(0,Math.round(Number(b.bonusUse)||0)),bonusBalance(),Math.round(Number(b.total)||0));
  if(use) bonusTx('debit',use,`Оплата визита · ${b.vehicleName}`);
  const rubPaid=Math.max(0,Math.round((Number(b.total)||0)-use));
  const cashback=Math.round(rubPaid*0.05);
  if(cashback) bonusTx('credit',cashback,`5% за визит · ${b.vehicleName}`);
  b.bonusUse=use;
  b.cashPaid=rubPaid;
  b.cashback=cashback;
  b.bonusSettled=true;
  return b;
}

function bookingId(){
  if(window.crypto && typeof window.crypto.randomUUID==='function'){
    try{return window.crypto.randomUUID()}catch(_){}
  }
  return `booking-${Date.now()}-${Math.random().toString(16).slice(2)}`;
}
function normalizeBooking(b){
  if(!b || typeof b!=='object') return null;
  return {
    ...b,
    id:b.id||bookingId(),
    status:BOOKING_STATUS[b.status]?b.status:'waiting',
    createdAt:b.createdAt||new Date().toISOString()
  };
}
function migrateOldBooking042(){
  if(storageGet(BOOKINGS_KEY)!==null) return;
  let migrated=[];
  const v042=storageGet('tcity_bookings_v042');
  if(v042){
    try{
      const arr=JSON.parse(v042);
      if(Array.isArray(arr)) migrated=arr.map(normalizeBooking).filter(Boolean);
    }catch(_){}
  }
  const oldRaw=storageGet('tcity_current_booking');
  if(oldRaw){
    try{
      const old=normalizeBooking(JSON.parse(oldRaw));
      if(old && !migrated.length) migrated=[old];
    }catch(_){}
  }
  storageSet(BOOKINGS_KEY,JSON.stringify(migrated));
  storageRemove('tcity_current_booking');
}
function getBookings(){
  migrateOldBooking042();
  const raw=storageGet(BOOKINGS_KEY);
  if(!raw) return [];
  try{
    const parsed=JSON.parse(raw);
    if(!Array.isArray(parsed)) return [];
    const normalized=parsed.map(normalizeBooking).filter(Boolean);
    return normalized;
  }catch(_){
    return [];
  }
}
function saveBookings(items){
  storageSet(BOOKINGS_KEY,JSON.stringify(items));
  updateBookingMenu();
}
function getBookingById(id){
  return getBookings().find(b=>b.id===id)||null;
}
function getCurrentBooking(){
  return getBookings()[0]||null;
}
function removeBooking(id){
  saveBookings(getBookings().filter(b=>b.id!==id));
}
function bookingSortValue(b){
  return `${b.dateKey||'9999-99-99'}-${String(b.time??99).padStart(2,'0')}`;
}

function fullBusy(i){
  return i===2 || i===8;
}
function busyBlocks(i){
  if(fullBusy(i)) return [[10,21]];
  const map={
    0:[[16,18]],
    1:[[12,14],[17,19]],
    3:[[10,12],[15,17]],
    4:[[13,16]],
    5:[[11,13],[18,20]],
    6:[[10,11],[14,16]],
    7:[[12,15]],
    9:[[10,13],[17,20]],
    10:[[14,17]],
    11:[[11,12],[16,18]],
    12:[[10,12],[19,21]],
    13:[[13,15]]
  };
  return map[i]||[];
}
function bookedBlocksForDate(dateKey){
  return getBookings()
    .filter(b=>b.dateKey===dateKey && b.id!==flowState.editingBookingId)
    .map(b=>[Number(b.time),Number(b.time)+Math.max(1,Number(b.hours)||1)]);
}
function reserveHours(){
  return Math.max(1,Math.ceil(calcSelection().hours));
}
function canStart(index,start,dateKey=flowState.dateKey){
  const duration=reserveHours();
  const end=start+duration;
  if(end>21) return false;
  const blocks=[...busyBlocks(index),...bookedBlocksForDate(dateKey)];
  return !blocks.some(([a,b])=>start<b && end>a);
}
function dateHasAnyStart(index,key){
  if(fullBusy(index)) return false;
  for(let h=10;h<21;h++){
    if(canStart(index,h,key)) return true;
  }
  return false;
}
function dateItems(){
  const base=tCityTodayDate();
  const items=[];
  for(let i=0;i<14;i++){
    const d=new Date(base);
    d.setDate(base.getDate()+i);
    const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    items.push({i,date:d,key,full:!dateHasAnyStart(i,key)});
  }
  return items;
}
function formatLongDate(key){
  const d=new Date(key+'T12:00:00');
  return `${d.getDate()} ${MONTHS[d.getMonth()]}`;
}

      <div class="time-grid">
        ${starts.map(h=>{
          const ok=canStart(flowState.dateIndex,h,flowState.dateKey);
          const selected=flowState.time===h;

        }).join('')}

  wrap.id='bookingAction';
  wrap.className='flow-section';
  wrap.innerHTML=`
    <div class="bonus-pay-card">

        <strong>T-БОНУСЫ</strong>

      <div class="bonus-pay-row">

      <div class="bonus-pay-note">

function bookingSnapshot(){
  const calc=calcSelection();
  const previous=flowState.editingBookingId?getBookingById(flowState.editingBookingId):null;
  return normalizeBooking({
    id:previous?.id||bookingId(),
    createdAt:previous?.createdAt||new Date().toISOString(),
    status:'waiting',
    vehicle:flowState.vehicle,
    garageCarId:flowState.garageCarId,
    vehicleName:flowState.garageCarId ? (GARAGE_CARS.find(c=>c.id===flowState.garageCarId)?.name || VEHICLES[flowState.vehicle].name) : VEHICLES[flowState.vehicle].name,
    packageId:flowState.packageId,
    extras:[...flowState.extras],
    dateKey:flowState.dateKey,
    time:flowState.time,
    total:calc.total,
    bonusUse:Math.min(Math.max(0,Math.round(Number(flowState.bonusUse)||0)),bonusBalance(),Math.round(calc.total)),
    hours:reserveHours(),
    rows:calc.rows,
    address:'г. Тюмень, ул. Василия Шамова, 8'
  });
}
function saveBooking(){
  const b=bookingSnapshot();
  let items=getBookings();
  const idx=items.findIndex(x=>x.id===b.id);
  if(idx>=0) items[idx]=b;
  else items.push(b);
  items.sort((a,b)=>bookingSortValue(a).localeCompare(bookingSortValue(b)));
  saveBookings(items);
  flowState.editingBookingId=null;
  renderSuccess(b);
}

}

function bookingStatusIndex(status){
  const i=BOOKING_STATUS_ORDER.indexOf(status);
  return i<0?0:i;
}
function bookingStatusTimeline(b){
  const current=bookingStatusIndex(b.status);
  const labels=[
    ['ЖДЁМ ВАС','Запись подтверждена'],
    ['АВТОМОБИЛЬ В РАБОТЕ','Работы начались'],
    ['ГОТОВ','Можно забирать'],
    ['ЗАВЕРШЕНО','Автомобиль выдан']
  ];
  return `
    <div class="booking-status">
      <div class="booking-status-kicker">СТАТУС</div>
      ${labels.map((x,i)=>`
        <div class="booking-status-row ${i<current?'done':''} ${i===current?'active':''}">
          <span class="booking-status-dot">${i<current?'✓':i===current?'•':''}</span>
          <span><strong>${x[0]}</strong><small>${x[1]}</small></span>
        </div>
      `).join('')}
    </div>
  `;
}
function bookingCardStatus(b){

function bindBookingFeedback(b){
  let value=0;
  const stars=[...document.querySelectorAll('[data-booking-star]')];
  stars.forEach(btn=>{
    btn.addEventListener('click',()=>{
      value=Number(btn.dataset.bookingStar);
      stars.forEach(s=>s.classList.toggle('active',Number(s.dataset.bookingStar)<=value));
    });
  });
  const send=document.getElementById('bookingFeedbackSend');
  if(!send) return;
  send.addEventListener('click',()=>{
    if(!value){
      const box=document.getElementById('bookingFeedbackStars');
      if(box) box.animate(
        [{transform:'translateX(0)'},{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}],
        {duration:220}
      );
      return;
    }
    const comment=(document.getElementById('bookingFeedbackText')?.value||'').trim();

    let saved=[];
    try{saved=JSON.parse(storageGet(FEEDBACKS_KEY)||'[]')}catch(_){}
    if(!Array.isArray(saved)) saved=[];
    saved.push({
      bookingId:b.id,
      vehicleName:b.vehicleName,
      rating:value,
      comment,
      createdAt:new Date().toISOString()
    });
    storageSet(FEEDBACKS_KEY,JSON.stringify(saved));

    // Keep compatibility with the existing feedback notification.
    storageSet('tcity_last_feedback',JSON.stringify({
      rating:value,
      comment,
      createdAt:new Date().toISOString()
    }));

    removeBooking(b.id);
    renderFeedbackThanks();
  });
}

function advanceBookingStatus(id){
  const items=getBookings();
  const b=items.find(x=>x.id===id);
  if(!b) return;
  const i=bookingStatusIndex(b.status);
  if(i<BOOKING_STATUS_ORDER.length-1){
    b.status=BOOKING_STATUS_ORDER[i+1];
    if(b.status==='completed') settleBookingBonuses(b);
    saveBookings(items);
  }
  renderCurrentBooking(id);
}

function renderCurrentBooking(input){
  let b=null;
  if(typeof input==='string') b=getBookingById(input);
  else if(input && input.id) b=getBookingById(input.id)||normalizeBooking(input);
  else b=getCurrentBooking();

  if(!b){
    renderVehicle('booking');
    return;
  }

  showFlow();
  setFlowStep('МОЯ ЗАПИСЬ');
  flowSummary.classList.add('hidden');
  const isWaiting=b.status==='waiting';
  const isCompleted=b.status==='completed';

  flowBody.innerHTML=`
    <div class="flow-enter">
      <div class="eyebrow">T-CITY | ESTETIC AUTO</div>
      <h1 class="flow-title">МОЯ ЗАПИСЬ</h1>
      <div class="current-badge">${BOOKING_STATUS[b.status]?.title||BOOKING_STATUS.waiting.title}</div>
      ${bookingStatusTimeline(b)}
      ${detailRows(b)}
      ${preliminaryBookingCard()}

      ${isCompleted?`
        <div class="completion-bonus">
          <strong>ВИЗИТ ЗАВЕРШЁН</strong>
          <span>${Number(b.bonusUse)>0?`Использовано ${new Intl.NumberFormat('ru-RU').format(b.bonusUse)} T-Бонусов. `:''}${Number(b.cashback)>0?`Начислено +${new Intl.NumberFormat('ru-RU').format(b.cashback)} T-Бонусов (5% от оплаченной рублями части).`:''}</span>
        </div>
        ${renderBookingFeedback(b)}
      `:''}

      <div class="confirm-actions">
        <button class="flow-btn primary" id="currentHome">ГЛАВНОЕ МЕНЮ</button>
        ${getBookings().length>1?'<button class="flow-btn" id="currentAll">ВСЕ МОИ ЗАПИСИ</button>':''}
        ${isWaiting?'<button class="flow-btn" id="currentChange">ИЗМЕНИТЬ ЗАПИСЬ</button>':''}
        ${isWaiting?'<button class="flow-btn" id="currentCancel">ОТМЕНИТЬ ЗАПИСЬ</button>':''}
      </div>

      ${!isCompleted?`
        <button class="booking-demo-status" id="demoNextStatus">ДЕМО · СЛЕДУЮЩИЙ СТАТУС</button>
        <div class="booking-demo-note">В реальной версии статус меняется из T-CITY ADMIN.</div>
      `:''}
    </div>
  `;
  flowBody.scrollTop=0;

  document.getElementById('currentHome').addEventListener('click',closeFlow);
  const all=document.getElementById('currentAll');
  if(all) all.addEventListener('click',renderBookingsList);

  const change=document.getElementById('currentChange');
  if(change){
    change.addEventListener('click',()=>{
      if(b.garageCarId && GARAGE_CARS.some(c=>c.id===b.garageCarId)){
        startGarageBooking(b.garageCarId,b.id);
        flowState.bonusUse=Number(b.bonusUse)||0;
      }else{
        renderVehicle('booking',b.id);
        flowState.bonusUse=Number(b.bonusUse)||0;
      }
    });
  }

  const cancel=document.getElementById('currentCancel');
  if(cancel) cancel.addEventListener('click',()=>openCancelBookingSheet(b.id));

  const next=document.getElementById('demoNextStatus');
  if(next) next.addEventListener('click',()=>advanceBookingStatus(b.id));

  if(isCompleted) bindBookingFeedback(b);
}

function renderCustomPrefs(items){
  if(!items.length) return '<div class="garage-list-note">Пока дополнительных предпочтений нет.</div>';
  return items.map((x,i)=>`<div class="pref-custom-item" data-pref-index="${i}"><div class="pref-custom-top"><div class="pref-custom-title">${escapeHtml(x.name)}</div><button class="pref-delete" data-pref-delete="${i}" aria-label="Удалить">×</button></div><input class="pref-custom-value" data-pref-value="${i}" value="${escapeHtml(x.value||'')}"></div>`).join('');
}
function collectPreferenceBase(id){
  const old=getGaragePreferences(id);
  const custom=(old.custom||[]).map((x,i)=>({name:x.name,value:(document.querySelector(`[data-pref-value="${i}"]`)?.value||x.value||'').trim()}));
  return {drink:(document.getElementById('prefDrink')?.value||'').trim(),scent:(document.getElementById('prefScent')?.value||'').trim(),wish:(document.getElementById('prefWish')?.value||'').trim(),custom};
}
function bindPreferenceActions(id){
  document.getElementById('prefSaveBtn').addEventListener('click',()=>{
    const data=collectPreferenceBase(id);saveGaragePreferencesData(id,data);
    const s=document.getElementById('prefStatus');s.textContent='Сохранено для следующих посещений.';setTimeout(()=>{if(s)s.textContent=''},2200);
  });
  document.getElementById('prefAddBtn').addEventListener('click',()=>{
    const name=document.getElementById('prefNewName').value.trim();
    const value=document.getElementById('prefNewValue').value.trim();
    if(!name || !value){document.getElementById('prefStatus').textContent='Заполните название и пожелание.';return}
    const data=collectPreferenceBase(id);data.custom.push({name,value});saveGaragePreferencesData(id,data);showGaragePreferences(id);
  });
  document.querySelectorAll('[data-pref-delete]').forEach(btn=>btn.addEventListener('click',()=>{
    const idx=Number(btn.dataset.prefDelete);const data=collectPreferenceBase(id);data.custom.splice(idx,1);saveGaragePreferencesData(id,data);showGaragePreferences(id);
  }));
}

function getNotifications(){
  const raw=storageGet('tcity_notifications');
  if(raw){
    try{
      const parsed=JSON.parse(raw);
      if(Array.isArray(parsed)) return parsed;
    }catch(_){}
  }
  storageSet('tcity_notifications',JSON.stringify(DEFAULT_NOTIFICATIONS));
  return JSON.parse(JSON.stringify(DEFAULT_NOTIFICATIONS));
}
function saveNotifications(items){
  storageSet('tcity_notifications',JSON.stringify(items));
  syncNotificationDot();
}
function syncNotificationDot(){
  const hasUnread=getNotifications().some(n=>!n.read);
  notifyBtn.classList.toggle('unread',hasUnread);
}
function markNotificationRead(id){
  const items=getNotifications();
  const n=items.find(x=>x.id===id);
  if(n && !n.read){
    n.read=true;
    saveNotifications(items);
  }else{
    syncNotificationDot();
  }
}

function chatTime(){
  const d=new Date();
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function defaultChat(){
  return [{

    text:'Здравствуйте. Здесь вы можете задать интересующий вас вопрос. Если готового ответа не окажется, мы разберём его персонально и ответим в ближайшее время.',
    time:chatTime(),

  }];
}
function getChat(){
  const raw=storageGet('tcity_support_chat_v034');
  if(raw){
    try{
      const parsed=JSON.parse(raw);
      if(Array.isArray(parsed) && parsed.length){
        // Upgrade old saved chat so the first welcome message can own quick actions.
        if(parsed[0] && parsed[0].side==='bot') parsed[0].welcome=true;
        return parsed;
      }
    }catch(_){}
  }
  const initial=defaultChat();
  storageSet('tcity_support_chat_v034',JSON.stringify(initial));
  return initial;
}
function saveChat(items){

}

function escapeHtml(text){
  return String(text)
    .replaceAll('&','&amp;')

function normalizeSupportText(text){
  return String(text)
    .toLowerCase()
    .replace(/[!?.,;:()[\]{}"'«»]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}
function containsAny(text,words){
  return words.some(w=>text.includes(w));
}
function localAssistantReply(text){
  const n=normalizeSupportText(text);

  if(!n){
    return 'Напишите вопрос — постараюсь помочь.';
  }

  // Exact quick-answer topics first.
  const exact=Object.entries(SUPPORT_ANSWERS).find(([q])=>normalizeSupportText(q)===n);
  if(exact) return exact[1];

  // Human small talk.
  if(
    n==='привет' || n==='приветик' || n==='здарова' || n==='здорово' ||
    containsAny(n,['здравствуйте','здравствуй','добрый день','добрый вечер','доброе утро','hello',' hi'])
  ){
    return 'Здравствуйте. Чем могу помочь? Могу рассказать об услугах, стоимости, записи, графике работы или уходе за автомобилем.';
  }
  if(containsAny(n,['спасибо','благодарю','спс'])){
    return 'Пожалуйста. Если появятся ещё вопросы — я здесь.';
  }
  if(containsAny(n,['как дела','как вы','что нового'])){
    return 'Спасибо, всё хорошо. Готов помочь с вопросами по T-CITY и уходу за автомобилем.';
  }
  if(containsAny(n,['пока','до свидания','увидимся'])){
    return 'До встречи. Если что-то понадобится — напишите сюда в любое время.';
  }

  // Location / schedule.
  if(containsAny(n,['адрес','где вы','где находитесь','как доехать','локац'])){
    return 'T-CITY | ESTETIC AUTO: г. Тюмень, ул. Василия Шамова, 8.';
  }
  if(containsAny(n,['график','режим работы','до скольки','во сколько откры','работаете','время работы'])){
    return 'Работаем ежедневно с 10:00 до 21:00 по предварительной записи.';
  }

  // Booking.
  if(containsAny(n,['записаться','хочу запись','запись на','как запис','забронировать'])){
    return 'Записаться можно прямо в приложении: выберите тип автомобиля, услуги, свободную дату и время. Расчёт будет предварительным — окончательный объём работ можно изменить после осмотра автомобиля.';
  }

  // Prices / washing.
  if(containsAny(n,['сколько стоит мойка','цена мойки','мойка цена','помыть машину','обычная мойка'])){
    return 'Базовая ручная мойка сейчас начинается от 1 000 ₽ для седана, от 1 200 ₽ для кроссовера и от 1 400 ₽ для внедорожника. Итог зависит от состояния автомобиля.';
  }
  if(containsAny(n,['цена','стоимость','сколько стоит','прайс'])){
    return 'Цены зависят от типа кузова и выбранных услуг. В разделе «Услуги и цены» можно собрать свой набор и сразу увидеть предварительную стоимость.';
  }

  // Ceramic / quartz with non-selling honesty.
  if(containsAny(n,['нужна керамика','нужно керамик','стоит ли керамик','делать керамик'])){
    return 'Это зависит от состояния кузова и того, какой результат вы хотите получить. На месте можем сначала осмотреть автомобиль. Если керамика вам не нужна, мы прямо об этом скажем — лишние услуги не навязываем.';
  }
  if(containsAny(n,['керамик','кварц'])){
    return SUPPORT_ANSWERS['Керамика или кварц?'];
  }

  // Chemistry and common services.
  if(containsAny(n,['какую химию','химия','составы','средства используете'])){
    return SUPPORT_ANSWERS['Какую химию используем?'];
  }
  if(containsAny(n,['антидожд','дождь на стекло'])){
    return 'Антидождь создаёт гидрофобный слой на стекле: вода легче собирается в капли и уходит потоком воздуха. Эффект и необходимость обработки лучше оценивать по состоянию стекла.';
  }
  if(containsAny(n,['химчист','почистить салон','грязный салон'])){
    return 'Химчистка нужна, когда обычной уборки уже недостаточно: загрязнения в ткани, ковролине, пластике или коже требуют глубокой очистки. Перед работой оценим состояние салона и скажем, какой объём действительно нужен.';
  }
  if(containsAny(n,['полиров','царапин','царапины'])){
    return 'Полировка помогает восстановить блеск и уменьшить часть поверхностных дефектов лака. Глубокие повреждения могут полностью не уйти — это лучше определить после осмотра.';
  }
  if(containsAny(n,['двигател','моторный отсек','под капотом'])){
    return 'Детейлинг моторного отсека включает аккуратную очистку и уход за доступными поверхностями. Перед началом обязательно оцениваем состояние и риски для конкретного автомобиля.';
  }

  // Mobile / unusual vehicles.
  if(containsAny(n,['выезд','на дому','приехать ко мне'])){
    return SUPPORT_ANSWERS['Выездной детейлинг'];
  }
  if(containsAny(n,['квадро','мотоцикл','мото ','лодк','катер','нестандарт','техника'])){
    return SUPPORT_ANSWERS['Нестандартная техника'];
  }

  // Promotions.
  if(containsAny(n,['акции','скидк','бонус','подарок'])){
    return 'Актуальные акции, персональные предложения и бонусы появляются в разделе уведомлений. Если на колокольчике есть красная точка — там есть что-то новое.';
  }

  // What can assistant do?
  if(containsAny(n,['что ты умеешь','чем можешь помочь','помоги','что спросить'])){
    return 'Могу подсказать адрес и график, объяснить услуги, сориентировать по предварительным ценам, рассказать про керамику, кварц, химию, запись и другие базовые вопросы T-CITY.';
  }

  // Safe fallback: only here do we hand off to a human.
  return 'На этот вопрос лучше ответить персонально. Я передам его специалисту T-CITY — он разберётся в деталях и ответит здесь в ближайшее время.';
}

    return normalizeBooking({
      id:row.id,createdAt:row.created_at,status:BOOKING_STATUS[row.status]?row.status:'waiting',
      vehicle:row.vehicle_type||car?.type||'sedan',garageCarId:car?.id||null,
      vehicleName:row.make_model||car?.name||({sedan:'Седан',crossover:'Кроссовер',suv:'Внедорожник'}[row.vehicle_type]||'Автомобиль'),
      packageId:null,extras:[],dateKey:z.dateKey,time:z.time,total:Number(row.preliminary_total_rub)||0,
      bonusUse:Number(row.bonus_spent)||0,cashPaid:Number(row.cash_paid_rub)||0,cashback:Number(row.bonus_earned)||0,
      bonusSettled:row.status==='completed',hours:Math.max(1,Math.ceil((Number(row.duration_minutes)||60)/60)),
      rows:services.length?services:[{name:'Визит T-CITY',price:Number(row.preliminary_total_rub)||0}],
      address:'г. Тюмень, ул. Василия Шамова, 8',visitId:row.visit_id||null
    });
  });
  saveBookings(mappedBookings);

  const tx=(d.wallet?.history||[]).map(x=>({
    id:x.id,type:x.type,amount:Number(x.amount)||0,title:x.description||'T-Бонусы',date:clientRuDate(x.created_at)
  }));
  storageSet(BONUS_WALLET_KEY,JSON.stringify({
    balance:Number(d.wallet?.balance)||0,
    earnedTotal:tx.filter(x=>x.type==='credit').reduce((s,x)=>s+x.amount,0),
    spentTotal:tx.filter(x=>x.type==='debit').reduce((s,x)=>s+x.amount,0),
    transactions:tx
  }));

  const prefs=clientPrefObject(d.preferences||[]);
  GARAGE_CARS.forEach(c=>storageSet(`tcity_garage_preferences_${c.id}`,JSON.stringify(prefs)));

  const notices=(d.notifications||[]).map(n=>({
    id:n.id,type:String(n.type||'T-CITY').toUpperCase(),title:n.title||'T-CITY',preview:n.message||'',
    body:n.message||'',read:Boolean(n.read_at),kind:'server',createdAt:n.created_at
  }));
  storageSet('tcity_notifications',JSON.stringify(notices));

  clientBackendReady=true;
  updateBookingMenu();updateBonusMenu();syncNotificationDot();
}

function runProtectedClientAction(action){
  if(typeof action==='function') action();
}
function showClientLoginGate(message='Для этого раздела подтвердите вход через Telegram.'){
  showFlow();setFlowStep('ВХОД');flowSummary.classList.add('hidden');
  flowBody.innerHTML=`<div class="confirm-box flow-enter"><div style="width:100%">
    <div class="eyebrow">T-CITY | CLIENT</div><div class="confirm-title" style="margin-top:14px">ВОЙТИ В T-CITY</div>
    <div class="confirm-sub">${escapeHtml(message)}</div>
    <div class="confirm-actions"><button class="flow-btn primary" id="clientLoginTelegram">ПРОДОЛЖИТЬ В TELEGRAM</button><button class="flow-btn" id="clientLoginBack">НАЗАД</button></div>
    <div class="client-login-status" id="clientLoginStatus">После подтверждения вы автоматически вернётесь к выбранному действию.</div>
    <div class="client-login-note">История бренда и услуги доступны без входа.</div>
  </div></div>`;
  flowBody.scrollTop=0;
  document.getElementById('clientLoginTelegram').addEventListener('click',startClientBrowserLogin);
  document.getElementById('clientLoginBack').addEventListener('click',()=>{clientAfterLogin=null;closeFlow()});
}
async function startClientBrowserLogin(){
  const btn=document.getElementById('clientLoginTelegram');const st=document.getElementById('clientLoginStatus');if(btn)btn.disabled=true;
  try{
    const d=await clientApi('/api/auth/browser/start',{method:'POST'});
    storageSet(CLIENT_PENDING_LOGIN_KEY,d.token);
    if(st)st.textContent='Откройте T-CITY в Telegram, нажмите «Запустить» и вернитесь сюда.';
    const w=window.open(d.telegram_link,'_blank');if(!w)location.href=d.telegram_link;
    pollClientLogin(d.token);
  }catch(err){if(st)st.textContent=`Ошибка: ${err.message}`;if(btn)btn.disabled=false}
}
function pollClientLogin(token){
  clearInterval(clientLoginTimer);let tries=0;
  clientLoginTimer=setInterval(async()=>{
    if(++tries>280){clearInterval(clientLoginTimer);return}
    try{
      const st=await clientApi(`/api/auth/browser/status/${encodeURIComponent(token)}`);
      if(st.confirmed){
        clearInterval(clientLoginTimer);
        const ex=await clientApi('/api/auth/browser/exchange',{method:'POST',body:clientJson({token})});
        clientSession=ex.session_token||'';storageSet(CLIENT_SESSION_KEY,clientSession);storageRemove(CLIENT_PENDING_LOGIN_KEY);
        await hydrateClientState();
        closeFlow();const action=clientAfterLogin;clientAfterLogin=null;runProtectedClientAction(action);
      }
    }catch(err){console.error('T-CITY login:',err)}
  },1500);
}
async function tryTelegramMiniAppLogin(){
  if(clientSession) return false;
  try{
    const tg=window.Telegram?.WebApp;
    if(!tg?.initData) return false;
    try{tg.ready();tg.expand()}catch(_){}
    const d=await clientApi('/api/auth/telegram',{method:'POST',body:clientJson({initData:tg.initData})});
    clientSession=d.session_token||'';storageSet(CLIENT_SESSION_KEY,clientSession);
    await hydrateClientState();return true;
  }catch(err){console.error('Telegram Mini App auth:',err);return false}
}
async function ensureClientAuth(action){
  if(clientSession){
    try{if(!clientBackendReady)await hydrateClientState();runProtectedClientAction(action);return true}
    catch(err){if(err.status!==401){alert(`Ошибка сервера: ${err.message}`);return false}}
  }
  clientAfterLogin=action;
  if(await tryTelegramMiniAppLogin()){
    const a=clientAfterLogin;clientAfterLogin=null;runProtectedClientAction(a);return true;
  }
  showClientLoginGate();return false;
}

// Browser: only personal sections trigger authorization. Telegram Mini App authenticates silently.
document.querySelectorAll('.menu button[data-page="booking"],.menu button[data-page="garage"],.menu button[data-page="bonus"]').forEach(btn=>{
  btn.addEventListener('click',e=>{
    if(clientSession) return;
    e.preventDefault();e.stopImmediatePropagation();
    const target=btn.dataset.page;
    ensureClientAuth(()=>{
      if(target==='booking'){if(getBookings().length)renderBookingsList();else renderVehicle('booking')}
      if(target==='garage')showGarageList();
      if(target==='bonus')showBonusWallet('home');
    });
  },true);
});

// Preferences are saved on the server; the UI remains the approved free-text Wave 04.4 UI.
saveGaragePreferencesData=function(id,data){
  storageSet(`tcity_garage_preferences_${id}`,JSON.stringify(data));
  if(clientSession){
    const rows=clientPrefRows(data);
    clientApi('/api/client/preferences',{method:'PUT',body:clientJson({preferences:rows})})
      .then(()=>GARAGE_CARS.forEach(c=>storageSet(`tcity_garage_preferences_${c.id}`,JSON.stringify(data))))
      .catch(err=>console.error('Preferences:',err));
  }
};

// Booking creation/editing now writes to PostgreSQL.
saveBooking=async function(){
  if(!clientSession){await ensureClientAuth(()=>saveBooking());return}
  const b=bookingSnapshot();
  const payload={
    car_id:b.garageCarId||null,vehicle_type:b.vehicle,
    starts_at:`${b.dateKey}T${String(b.time).padStart(2,'0')}:00:00+05:00`,
    duration_minutes:Math.max(60,(Number(b.hours)||1)*60),preliminary_total_rub:Number(b.total)||0,
    bonus_spent:Number(b.bonusUse)||0,comment:null,services:(b.rows||[]).map(x=>({name:x.name,price_rub:Number(x.price)||0}))
  };
  try{
    const path=flowState.editingBookingId?`/api/client/bookings/${encodeURIComponent(flowState.editingBookingId)}`:'/api/client/bookings';
    const method=flowState.editingBookingId?'PATCH':'POST';
    const d=await clientApi(path,{method,body:clientJson(payload)});
    flowState.editingBookingId=null;
    await hydrateClientState();
    const saved=getBookingById(d.booking?.id)||normalizeBooking({...b,id:d.booking?.id||b.id});
    renderSuccess(saved);
  }catch(err){
    const btn=document.getElementById('confirmBooking');if(btn){btn.disabled=false;btn.textContent=flowState.editingBookingId?'СОХРАНИТЬ ИЗМЕНЕНИЯ':'ЗАПИСАТЬСЯ'}
    alert(err.status===409?'Это время уже занято. Выберите другое окно.':`Не удалось сохранить запись: ${err.message}`);
    if(err.status===409)renderBooking();
  }
};

openCancelBookingSheet=function(id){
  sheetTitle.textContent='Отменить запись?';sheetText.innerHTML=`<div class="sheet-copy">Дата и время будут освобождены. Это действие можно подтвердить или оставить запись без изменений.</div><div class="sheet-row"><button class="flow-btn" id="keepBooking">ОСТАВИТЬ</button><button class="flow-btn sheet-danger" id="confirmCancelBooking">ОТМЕНИТЬ</button></div>`;
  shade.classList.remove('hidden');document.getElementById('keepBooking').addEventListener('click',closeSheet);
  document.getElementById('confirmCancelBooking').addEventListener('click',async()=>{
    const btn=document.getElementById('confirmCancelBooking');if(btn)btn.disabled=true;
    try{await clientApi(`/api/client/bookings/${encodeURIComponent(id)}/cancel`,{method:'PATCH'});await hydrateClientState();closeSheet();renderCancelledBooking()}
    catch(err){if(btn)btn.disabled=false;alert(`Не удалось отменить запись: ${err.message}`)}

};

// Notifications are real and read state is synced with ADMIN/backend.
const legacyNoticeDetailContent=noticeDetailContent;
noticeDetailContent=function(n){
  if(n?.kind==='server') return `<div class="notice-detail-copy">${escapeHtml(n.body||n.preview||'')}</div>`;
  return legacyNoticeDetailContent(n);
};
markNotificationRead=function(id){
  const items=getNotifications();const n=items.find(x=>x.id===id);
  if(n&&!n.read){n.read=true;saveNotifications(items);if(clientSession)clientApi(`/api/client/notifications/${encodeURIComponent(id)}/read`,{method:'PATCH'}).catch(()=>{})}
  else syncNotificationDot();
};

// Completed-visit feedback goes to PostgreSQL and then disappears from active "Мои записи".
bindBookingFeedback=function(b){
  let value=0;const stars=[...document.querySelectorAll('[data-booking-star]')];
  stars.forEach(btn=>btn.addEventListener('click',()=>{value=Number(btn.dataset.bookingStar);stars.forEach(s=>s.classList.toggle('active',Number(s.dataset.bookingStar)<=value))}));
  const send=document.getElementById('bookingFeedbackSend');if(!send)return;
  send.addEventListener('click',async()=>{
    if(!value){const box=document.getElementById('bookingFeedbackStars');if(box)box.animate([{transform:'translateX(0)'},{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}],{duration:220});return}
    const comment=(document.getElementById('bookingFeedbackText')?.value||'').trim();send.disabled=true;
    try{
      await clientApi('/api/client/feedback',{method:'POST',body:clientJson({booking_id:b.id,rating:value,comment})});
      storageSet('tcity_last_feedback',JSON.stringify({rating:value,comment,createdAt:new Date().toISOString()}));
      await hydrateClientState();renderFeedbackThanks();
    }catch(err){send.disabled=false;alert(`Не удалось отправить отзыв: ${err.message}`)}
  });
};

// Unknown support questions are escalated to the real ADMIN chat when the client is authenticated.
const legacyRenderSupportChat=renderSupportChat;
async function syncRealSupport(){
  if(!clientSession)return;
  try{
    const d=await clientApi('/api/support');
    if(!d.thread||(d.messages||[]).length===0)return;
    const items=defaultChat();
    (d.messages||[]).forEach(m=>items.push({side:m.sender==='client'?'user':'bot',text:m.message,time:new Date(m.created_at).toLocaleTimeString('ru-RU',{timeZone:T_CITY_TIMEZONE,hour:'2-digit',minute:'2-digit'})}));
    saveChat(items);
  }catch(err){console.error('Support sync:',err)}
}
renderSupportChat=async function(){await syncRealSupport();legacyRenderSupportChat()};
sendSupportMessage=function(prefill=null){
  const input=document.getElementById('chatInput');const text=(prefill!==null?prefill:(input?input.value:'')).trim();if(!text)return;if(input)input.value='';
  appendChat('user',text);refreshChatMessages();scrollChatBottom(true);const typing=document.getElementById('chatTyping');if(typing)typing.classList.remove('hidden');
  const reply=localAssistantReply(text);const needsHuman=reply.startsWith('На этот вопрос лучше ответить персонально');
  clearTimeout(supportReplyTimer);supportReplyTimer=setTimeout(()=>{appendChat('bot',reply);refreshChatMessages();scrollChatBottom(true)},650);
  if(needsHuman&&clientSession)clientApi('/api/support',{method:'POST',body:clientJson({message:text})}).catch(err=>console.error('Support send:',err));
};

async function bootClientBackend(){
  try{
    if(clientSession){await hydrateClientState()}
    else await tryTelegramMiniAppLogin();
  }catch(err){console.error('T-CITY backend boot:',err);clientSession='';storageRemove(CLIENT_SESSION_KEY);clientBackendReady=false}
  const pending=storageGet(CLIENT_PENDING_LOGIN_KEY);if(!clientSession&&pending)pollClientLogin(pending);
}

setInterval(()=>{if(clientSession)hydrateClientState().catch(()=>{})},15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&clientSession)hydrateClientState().catch(()=>{})});
bootClientBackend();
</script>
